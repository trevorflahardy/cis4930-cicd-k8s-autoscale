[project]
name = "orders"
version = "1.0.0"
description = "Mock order-processing API and queue worker used to exercise the CI/CD pipeline"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "fakeredis>=2.26",
    "ruff>=0.8",
    "httpx2>=2.16.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: needs real Postgres and Redis (PG_HOST / REDIS_HOST)"]
addopts = "-ra"

[tool.coverage.run]
source = ["orders"]
omit = ["orders/migrate.py"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
